name: Terraform CI/CD

run-name: Deploy the dev

on:

  # Feature branch par push hone par Plan chalega
  push:
    branches:
      - 'feature/**'
      - main

  # Feature branch se main ke liye PR banne par Plan chalega
  pull_request:
    branches:
      - main

  # Manual run
  workflow_dispatch:


jobs:

  # ==========================================================
  # TERRAFORM PLAN
  # ==========================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        run: terraform init


      # ------------------------------------------------------
      # Terraform Format Check
      # ------------------------------------------------------
      - name: Terraform Format
        run: terraform fmt -check -recursive


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


      # ======================================================
      # TFLINT
      # ======================================================

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive


      # ======================================================
      # TFSEC
      # ======================================================

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false


      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        run: terraform plan


  # ==========================================================
  # TERRAFORM APPLY
  # ==========================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Apply ONLY when code is pushed/merged into main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Apply tabhi chale jab Plan successful ho
    needs: terraform-plan

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve