name: Terraform CI/CD

on:

  # Feature branch par push hone par CI chalega
  push:
    branches:
      - 'feature/**'
      - main

  # Feature branch se main ke liye PR banne par CI chalega
  pull_request:
    branches:
      - main

  # Manual run
  workflow_dispatch:

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
     
      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan


  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Only run after code is pushed/merged to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
